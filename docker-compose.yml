services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: towing
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # The api container migrates on boot, so it must not start until Postgres
    # is actually accepting connections (not merely "started").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d towing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Pub/sub only for now, so persistence is off deliberately: a restart
    # loses nothing that matters and keeps the local stack light.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:secret@db/towing
      JWT_SECRET_KEY: super-secret-key
      REDIS_URL: redis://redis:6379/0
      # Read from a gitignored .env that compose loads automatically, so the
      # service-account key never enters the repository. Unset is fine: push
      # is skipped and everything else works.
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      # Unlocks app/seed.py. Deliberately set HERE and not in the image, so the
      # published image cannot seed demo data in any environment that doesn't
      # opt in via this dev-only compose file.
      ALLOW_DEMO_SEED: "yes"
    # Migrations + demo seed run as a compose-level override. The image's own
    # CMD stays a plain `uvicorn`, so production runs the same image without
    # ever touching alembic or the seed. Nothing to remember to switch off.
    # Migrations hard-fail (the app cannot serve without a schema); the demo
    # seed is advisory, so a guard refusal logs and the API still starts.
    command: >
      sh -c "python -m alembic upgrade head &&
      { python -m app.seed || echo '[seed] skipped - see message above'; } &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
