['main, develop]\n  pull_request:\n    branches: [main, develop]\n\nenv:\n  REGISTRY: ghcr.io\n  IMAGE_NAME: ${{ github.repository }}\n\njobs:\n  # Backend tests\n  backend-test:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: ./backend\n\n    services:\n      postgres:\n        image: postgres:15-alpine\n        env:\n          POSTGRES_USER: postgres\n          POSTGRES_PASSWORD: postgres\n          POSTGRES_DB: towing_test\n        ports:\n          - 5432:5432\n        options: >-\n          --health-cmd="pg_isready -U postgres', 'health-interval=10s\n          --health-timeout=5s\n          --health-retries=5\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: \'3.12\'\n          cache: \'pip\'\n          cache-dependency-path: backend/requirements.txt\n\n      - name: Install uv\n        run: pip install uv\n\n      - name: Install dependencies\n        run: uv pip install -r requirements.txt\n\n      - name: Run Alembic migrations\n        env:\n          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/towing_test\n        run: alembic upgrade head\n\n      - name: Run backend tests\n        env:\n          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/towing_test\n          SECRET_KEY: test-secret-key\n          ALGORITHM: HS256\n          ACCESS_TOKEN_EXPIRE_MINUTES: 30\n        run: pytest -v --tb=short\n\n  # Frontend tests\n  frontend-test:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: ./web\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: \'20\'\n          cache: \'npm\'\n          cache-dependency-path: web/package-lock.json\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linting\n        run: npm run lint\n\n      - name: Run type checking\n        run: npx tsc --noEmit\n\n      - name: Run tests\n        run: npm test -- --ci --coverage\n\n      - name: Build Next.js app\n        run: npm run build\n\n  # Flutter tests\n  flutter-test:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: ./mobile\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Flutter\n        uses: subosito/flutter-action@v2\n        with:\n          flutter-version: \'3.22\'\n          channel: \'stable\'\n          cache: true\n\n      - name: Install dependencies\n        run: flutter pub get\n\n      - name: Run analyzer\n        run: flutter analyze\n\n      - name: Run tests\n        run: flutter test --coverage\n\n  # Docker build and push\n  docker-build:\n    needs: [backend-test, frontend-test, flutter-test]\n    runs-on: ubuntu-latest\n    if: github.event_name == \'push\' && github.ref == \'refs/heads/main\'\n    permissions:\n      contents: read\n      packages: write\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      - name: Set up Docker Buildx\n        uses: docker/setup-buildx-action@v3\n\n      - name: Log in to Container Registry\n        uses: docker/login-action@v3\n        with:\n          registry: ${{ env.REGISTRY }}\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n\n      - name: Extract metadata for Backend\n        id: meta-backend\n        uses: docker/metadata-action@v5\n        with:\n          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend\n          tags: |\n            type=ref,event=branch\n            type=sha,prefix=\n            type=raw,value=latest,enable={{is_default_branch}}\n\n      - name: Build and push Backend\n        uses: docker/build-push-action@v5\n        with:\n          context: ./backend\n          push: true\n          tags: ${{ steps.meta-backend.outputs.tags }}\n          labels: ${{ steps.meta-backend.outputs.labels }}\n          cache-from: type=gha\n          cache-to: type=gha,mode=max\n\n      - name: Extract metadata for Frontend\n        id: meta-frontend\n        uses: docker/metadata-action@v5\n        with:\n          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend\n          tags: |\n            type=ref,event=branch\n            type=sha,prefix=\n            type=raw,value=latest,enable={{is_default_branch}}\n\n      - name: Build and push Frontend\n        uses: docker/build-push-action@v5\n        with:\n          context: ./web\n          push: true\n          tags: ${{ steps.meta-frontend.outputs.tags }}\n          labels: ${{ steps.meta-frontend.outputs.labels }}\n          cache-from: type=gha\n          cache-to: type=gha,mode=max\n\n  # Deploy preview\n  deploy-preview:\n    needs: docker-build\n    runs-on: ubuntu-latest\n    if: github.event_name == \'push\' && github.ref == \'refs/heads/main\'\n    permissions:\n      contents: read\n      packages: read\n    steps:\n      - name: Deploy to preview environment\n        run: |\n          echo "Deploy preview step - configure your deployment target here"\n          echo', 'Example: kubectl apply, docker compose deploy, etc.']