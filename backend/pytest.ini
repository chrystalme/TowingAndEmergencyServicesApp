[pytest]
# Register custom markers (silences PytestUnknownMarkWarning)
markers =
    e2e: end-to-end suite that requires the live Dockerized API (see e2e/api).
    asyncio: async test.
asyncio_mode = auto

# Keep the fast unit/integration run clean: default collection is scoped to
# app/tests only (testpaths). The live-server e2e suite is opt-in:
#   pytest -m e2e e2e/api
python_files = test_*.py
testpaths = app/tests
