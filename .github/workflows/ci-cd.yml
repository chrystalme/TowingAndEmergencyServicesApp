name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- backend
  backend-test:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: towing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      # requirements.txt alone cannot run the suite: pytest, pytest-asyncio,
      # httpx and aiosqlite live in requirements-dev.txt.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The unit suite runs on in-memory aiosqlite (see app/tests/conftest.py),
      # so this step exists to prove the migrations themselves apply to a real
      # Postgres — which is what production actually runs.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/towing_test
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          # NOTE: the app reads JWT_SECRET_KEY. SECRET_KEY / ALGORITHM have no
          # effect — that was a long-standing trap in the previous workflow.
          JWT_SECRET_KEY: ci-test-secret-not-used-in-production
          ACCESS_TOKEN_EXPIRE_MINUTES: '30'
        run: PYTHONPATH=. pytest -v --tb=short

  # ------------------------------------------------------------ backend e2e
  # Drives the real HTTP surface against a real Postgres, which is the check
  # that would have caught a deploy coming up healthy against an unmigrated
  # database (/health does not touch the DB, so it passes either way).
  backend-e2e:
    name: Backend E2E (live server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: towing_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/towing_e2e
      JWT_SECRET_KEY: ci-e2e-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      # Server and suite run in ONE step on purpose: a process backgrounded in
      # an earlier step is not guaranteed to survive into the next one.
      # The runner itself is stdlib-only, so it needs nothing beyond app deps.
      - name: Start API and run E2E suite
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API up after ${i}s"
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process died during startup"; exit 1
            fi
            if [ "$i" -eq 60 ]; then echo "API failed to start"; exit 1; fi
            sleep 1
          done

          python e2e/api/run_e2e.py

  # ---------------------------------------------------------------- web
  frontend-test:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Requires web/.eslintrc.json — without it `next lint` tries to scaffold
      # a config interactively and hangs the job.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- mobile
  flutter-test:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Deliberately unpinned. mobile/pubspec.yaml requires Dart ^3.12.0 and
          # the test suite uses wildcard parameters, so the previously pinned
          # Flutter 3.22 (Dart 3.4) could not resolve or compile this package.
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------- image
  docker-build:
    name: Build & push backend image
    needs: [backend-test, backend-e2e, frontend-test, flutter-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: there is deliberately no frontend image job. web/Dockerfile has no
  # build stage — it COPYs a prebuilt .next/standalone that is gitignored, and
  # .dockerignore excludes src/ — so building it in CI can only fail. Restore
  # this job once that Dockerfile builds from source.
