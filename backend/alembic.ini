# Alembic configuration file
# Generated for TowingAndEmergencyServicesApp backend

[alembic]
# path to migration scripts
script_location = alembic
# template for migration scripts (optional)
# file_template = %%(rev)s_%%(slug)s

# DB URL – will be overridden by env var or settings at runtime
sqlalchemy.url = postgresql+asyncpg://postgres:secret@db/towing

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S